name: blender

# Headless Blender 4.5 LTS integration and golden tests. These are not yet a required gate:
# spike S3 must first show that GPU-less rendering is reliable on hosted runners
# (docs/DEPLOYMENT.md#ci).

on:
  push:
    branches: [main]
    paths:
      - "blender/**"
      - "backend/src/kinesis/analysis/**"
      - "backend/src/kinesis/repair/**"
      - "backend/src/kinesis/evaluation/**"
      - "backend/src/kinesis/schemas/**"
      - "tests/integration/**"
      - "tests/golden/**"
      - "spikes/s[123]_*.py"
      - "scripts/tasks.py"
      - ".github/workflows/blender.yml"
  pull_request:
    paths:
      - "blender/**"
      - "backend/src/kinesis/analysis/**"
      - "backend/src/kinesis/repair/**"
      - "backend/src/kinesis/evaluation/**"
      - "backend/src/kinesis/schemas/**"
      - "tests/integration/**"
      - "tests/golden/**"
      - "spikes/s[123]_*.py"
      - "scripts/tasks.py"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "4.5.14"
  BLENDER_SHA256: "9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3"

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: system libraries for headless Blender (EGL / software GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libgles2 libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libsm6
      - name: cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .tools
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: download Blender (checksum-verified)
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run task setup-blender
      - name: spikes S1-S3 (results uploaded as an artifact)
        env:
          KINESIS_BLENDER_BIN: ${{ github.workspace }}/.tools/blender-${{ env.BLENDER_VERSION }}-linux-x64/blender
        run: |
          status=0
          for s in s1_nla_layering s2_fk_parity s3_headless_render; do
            "$KINESIS_BLENDER_BIN" --background --factory-startup -noaudio --python-exit-code 3 \
              --python "spikes/$s.py" -- --out "var/spikes/$s.json" || status=1
          done
          cat var/spikes/*.json || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-results
          path: var/spikes/
      - name: run Blender tests
        if: always()
        env:
          KINESIS_BLENDER_BIN: ${{ github.workspace }}/.tools/blender-${{ env.BLENDER_VERSION }}-linux-x64/blender
        run: |
          "$KINESIS_BLENDER_BIN" --version
          uv run pytest -m blender
