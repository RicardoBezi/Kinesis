name: blender

# Headless Blender 4.5 LTS integration and golden tests.
#
# The workflow always runs (no workflow-level `paths:`), so its `blender-gate` check always
# reports and can be required by branch protection without deadlocking PRs that do not touch
# Blender code. The expensive `blender` job runs only when relevant paths changed, nightly,
# or on manual dispatch; `blender-gate` passes when it succeeded or was skipped.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: blender-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BLENDER_VERSION: "4.5.14"
  BLENDER_SHA256: "9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3"

jobs:
  changes:
    name: blender paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      blender: ${{ steps.filter.outputs.blender }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            blender:
              - "blender/**"
              - "backend/src/kinesis/**"
              - "tests/integration/**"
              - "tests/golden/**"
              - "spikes/s[123]_*.py"
              - "scripts/tasks.py"
              - "infra/docker/blender-worker.Dockerfile"
              - ".github/workflows/blender.yml"

  blender:
    needs: changes
    if: >-
      needs.changes.outputs.blender == 'true'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: system libraries for headless Blender (EGL / software GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libgles2 libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libsm6
      - name: cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: .tools
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: download Blender (checksum-verified)
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run task setup-blender
      - name: spikes S1-S3 (results uploaded as an artifact)
        env:
          KINESIS_BLENDER_BIN: ${{ github.workspace }}/.tools/blender-${{ env.BLENDER_VERSION }}-linux-x64/blender
        run: |
          status=0
          for s in s1_nla_layering s2_fk_parity s3_headless_render; do
            "$KINESIS_BLENDER_BIN" --background --factory-startup -noaudio --python-exit-code 3 \
              --python "spikes/$s.py" -- --out "var/spikes/$s.json" || status=1
          done
          cat var/spikes/*.json || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-results
          path: var/spikes/
      - name: run Blender tests
        if: always()
        env:
          KINESIS_BLENDER_BIN: ${{ github.workspace }}/.tools/blender-${{ env.BLENDER_VERSION }}-linux-x64/blender
        run: |
          "$KINESIS_BLENDER_BIN" --version
          uv run pytest -m blender

  # The required check. Passes when the blender job succeeded or was skipped (no relevant
  # changes); fails when it failed or was cancelled, or when path detection failed.
  blender-gate:
    name: blender-gate
    if: always()
    needs: [changes, blender]
    runs-on: ubuntu-latest
    steps:
      - name: evaluate
        env:
          CHANGES: ${{ needs.changes.result }}
          BLENDER: ${{ needs.blender.result }}
        run: |
          echo "changes=$CHANGES blender=$BLENDER"
          [ "$CHANGES" = "success" ] || exit 1
          case "$BLENDER" in success|skipped) exit 0 ;; *) exit 1 ;; esac

  # Phase 6: the containerized worker must give the same golden results as host Blender.
  # Nightly and manual only (the image is ~2 GB to build); not part of the merge gate.
  # A failure opens (or comments on) a tracking issue.
  container:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: build the worker image
        run: uv run task worker-image
      - name: container parity test
        run: uv run task test-container -s
      - name: report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly container parity failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The containerized worker no longer matches the golden results: $RUN_URL"
          fi
