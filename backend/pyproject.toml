[project]
name = "kinesis"
version = "0.1.0"
description = "Kinesis backend: localized animation repair service"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "redis>=5.2",
  "numpy>=2.1",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
# Nebius Serverless Jobs runner (Phase 6): RS256 service-account JWTs and the S3-compatible
# bucket that is mounted into each job as /work.
nebius = ["cryptography>=43", "boto3>=1.35"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinesis"]
